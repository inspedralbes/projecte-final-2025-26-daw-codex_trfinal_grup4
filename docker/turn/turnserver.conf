# /etc/coturn/turnserver.conf
# Configuration for WebRTC TURN relay - c0dex.cat

# Use Fingerprinting for STUN
fingerprint

# Long-term credential mechanism
lt-cred-mech

# The realm should match your domain
realm=c0dex.cat

# Port configuration
listening-port=3478

# Explicitly listen on all interfaces
listening-ip=0.0.0.0

# Range for media relay traffic (UDP)
min-port=49152
max-port=65535

# Logging - keep stdout so docker logs works
verbose

# Performance - no limits
total-quota=0
bps-capacity=0
stale-nonce=600

# Security
no-multicast-peers
no-tlsv1
no-tlsv1.1
