# /etc/coturn/turnserver.conf
# Professional configuration for WebRTC in production

# Use Fingerprinting
fingerprint

# Static auth secret or long-term credentials
# We use long-term credentials for simplicity in this setup
# The user is defined in the docker command line for now, 
# but we can also use use-auth-secret.
lt-cred-mech

# The realm should match your domain
realm=codex.daw.inspedralbes.cat

# Port configuration
listening-port=3478
tls-listening-port=5349

# Range for media traffic (UDP)
min-port=49152
max-port=65535

# Logging
verbose
log-file=/var/log/turnserver.log

# Performance
total-quota=0
bps-capacity=0
stale-nonce=600

# Security
no-stdout-log
no-multicast-peers
no-tlsv1
no-tlsv1.1

# Enable monitoring
# monitoring-port=3479
